workflows:
  toe-pwar-ios-unsigned:
    name: Toe Pwar POS iPhone - unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.47.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Check Flutter and fetch dependencies
        script: |
          flutter --version
          flutter pub get --enforce-lockfile
      - name: Build iPhone app without signing
        script: flutter build ios --debug --no-codesign --no-pub
    artifacts:
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
